name: Mirror from Disroot

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_KEY }}

      - name: Force Mirror from Disroot
        env:
          GH_TOKEN: ${{ secrets.MIRROR_KEY }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote add disroot https://git.disroot.org/pwshAgyjkcrg761/KryptDist-py.git
          
          # Fetch with --prune-tags to drop local references to tags deleted on Disroot
          git fetch disroot main --tags --prune-tags --force
          
          git checkout main
          git reset --hard disroot/main
          
          # Push main branch and prune deleted tags on GitHub
          git push https://x-access-token:${{ secrets.MIRROR_KEY }}@github.com/pwshAgyjkcrg761/KryptDist-py.git main --force
          git push https://x-access-token:${{ secrets.MIRROR_KEY }}@github.com/pwshAgyjkcrg761/KryptDist-py.git --tags --prune --force
          
          # Delete any GitHub Release UI entry if its corresponding tag is gone
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r rel; do
            git rev-parse "$rel" >/dev/null 2>&1 || gh release delete "$rel" --cleanup-tag --yes
          done